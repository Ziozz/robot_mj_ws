[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-mj"
version = "0.1.0"
description = "Modular MuJoCo manipulation simulation for humanoids and dual-arm robots"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "mujoco>=3.1",
  "numpy>=1.24",
]

[project.optional-dependencies]
planning = [
  "scipy>=1.10",
  "toppra==0.6.10",
  "pin==4.1.0",
  "ompl>=2.0,<2.1",
]
dev = [
  "pytest>=8",
]

[project.scripts]
robot-mj-view = "robot_mj.apps.view_scene:main"
robot-mj-collision = "robot_mj.apps.check_collision:main"
robot-mj-plan = "robot_mj.apps.plan_trajectory:main"
robot-mj-grasp = "robot_mj.apps.grasp_pick:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
